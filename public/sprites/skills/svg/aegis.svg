<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shieldGlow" x="-25%" y="-15%" width="150%" height="130%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g filter="url(#shieldGlow)">
    <path d="M 200,40 L 320,120 L 280,380 Q 200,420 120,380 L 80,120 Z" fill="url(#shieldFace)" stroke="#bae6fd" stroke-width="4">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 200,100 L 250,140 L 230,320 Q 200,340 170,320 L 150,140 Z" fill="#ffffff" opacity="0.25"/>
    <ellipse cx="200" cy="400" rx="70" ry="14" fill="#38bdf8" opacity="0.25">
      <animate attributeName="rx" values="55;80;55" dur="0.75s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.1;0.88;1" dur="0.95s" repeatCount="indefinite"/>
</svg>
