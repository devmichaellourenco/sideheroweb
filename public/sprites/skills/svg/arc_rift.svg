<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <radialGradient id="riftCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e879f9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#701a75" stop-opacity="0"/>
    </radialGradient>
    <filter id="riftGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <g filter="url(#riftGlow)">
    <ellipse cx="210" cy="210" rx="40" ry="100" fill="url(#riftCore)">
      <animate attributeName="rx" values="25;55;25" dur="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M 210,60 Q 250,210 210,360 Q 170,210 210,60 Z" fill="none" stroke="#f0abfc" stroke-width="5" opacity="0.8">
      <animate attributeName="stroke-width" values="3;8;3" dur="0.3s" repeatCount="indefinite"/>
    </path>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.78;1" dur="0.5s" repeatCount="indefinite"/>
</svg>
