<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0"/>
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloodGlow" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g filter="url(#bloodGlow)">
    <path d="M 100,200 C 220,120 380,140 700,180 L 660,240 C 400,220 240,260 140,230 Z" fill="url(#bloodGrad)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="0.2s" repeatCount="indefinite"/>
    </path>
    <g fill="#ef4444" opacity="0.85">
      <circle cx="620" cy="190" r="4">
        <animate attributeName="cx" values="620;680" dur="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="580" cy="210" r="3">
        <animate attributeName="cx" values="580;640" dur="0.35s" begin="0.05s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="0.35s" begin="0.05s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.72;1" dur="0.45s" repeatCount="indefinite"/>
</svg>
