<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <radialGradient id="haloCore" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="40%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="holyGlow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#holyGlow)">
    <ellipse cx="200" cy="230" rx="90" ry="90" fill="url(#haloCore)">
      <animate attributeName="ry" values="82;98;82" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <g opacity="0.8">
      <rect x="192" y="60" width="16" height="180" fill="url(#rayBeam)" rx="8">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="192" y="60" width="16" height="180" fill="url(#rayBeam)" rx="8" transform="rotate(45 200 230)">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.9s" begin="0.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="192" y="60" width="16" height="180" fill="url(#rayBeam)" rx="8" transform="rotate(-45 200 230)">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.85s" begin="0.15s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g fill="#ffffff">
      <circle cx="200" cy="120" r="3" opacity="0.9">
        <animate attributeName="cy" values="120;280" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="150" r="2" fill="#fde68a">
        <animate attributeName="cy" values="150;300" dur="1s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="230" cy="140" r="2">
        <animate attributeName="cy" values="140;290" dur="0.85s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="0.85s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <ellipse cx="200" cy="360" rx="70" ry="16" fill="#fbbf24" opacity="0.25">
      <animate attributeName="rx" values="55;80;55" dur="1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <animate attributeName="opacity" values="0;1;1;0" times="0;0.1;0.88;1" dur="1s" repeatCount="indefinite"/>
</svg>
