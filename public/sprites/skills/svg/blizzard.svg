<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="windStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="impactGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <g filter="url(#blurEffect)">
    <line x1="-100" y1="100" x2="500" y2="550" stroke="url(#windStreak)" stroke-width="4" stroke-dasharray="100 200">
      <animate attributeName="stroke-dashoffset" values="300;-600" dur="0.8s" repeatCount="indefinite" />
    </line>
    <line x1="-50" y1="50" x2="550" y2="500" stroke="url(#windStreak)" stroke-width="2" stroke-dasharray="150 150">
      <animate attributeName="stroke-dashoffset" values="450;-450" dur="0.6s" repeatCount="indefinite" />
    </line>
    <line x1="-150" y1="200" x2="450" y2="600" stroke="url(#windStreak)" stroke-width="6" stroke-dasharray="80 300">
      <animate attributeName="stroke-dashoffset" values="200;-700" dur="1s" repeatCount="indefinite" />
    </line>
  </g>

  <path d="M 50,250 L 520,480 L 440,560 Z" fill="url(#windStreak)" opacity="0.15" filter="url(#heavyBlur)">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#blurEffect)">
    <line x1="460" y1="-100" x2="460" y2="540" stroke="url(#windStreak)" stroke-width="8" stroke-dasharray="200 400">
      <animate attributeName="stroke-dashoffset" values="600;-600" dur="0.5s" repeatCount="indefinite" />
    </line>
    <line x1="500" y1="-100" x2="500" y2="540" stroke="url(#windStreak)" stroke-width="5" stroke-dasharray="150 300">
      <animate attributeName="stroke-dashoffset" values="450;-750" dur="0.4s" repeatCount="indefinite" />
    </line>
    <line x1="440" y1="-100" x2="440" y2="540" stroke="url(#windStreak)" stroke-width="4" stroke-dasharray="100 250">
      <animate attributeName="stroke-dashoffset" values="350;-550" dur="0.6s" repeatCount="indefinite" />
    </line>
    <line x1="520" y1="-100" x2="520" y2="540" stroke="url(#windStreak)" stroke-width="6" stroke-dasharray="180 350">
      <animate attributeName="stroke-dashoffset" values="530;-650" dur="0.45s" repeatCount="indefinite" />
    </line>
  </g>

  <rect x="400" y="0" width="160" height="540" fill="url(#windStreak)" opacity="0.1" filter="url(#heavyBlur)">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="2s" repeatCount="indefinite"/>
  </rect>

  <g fill="#ffffff">
    <circle cx="0" cy="0" r="3" opacity="0.9">
      <animateMotion path="M 50,250 L 480,520" dur="0.7s" repeatCount="indefinite" begin="0s" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#bae6fd" opacity="0.8">
      <animateMotion path="M 80,220 L 510,510" dur="0.5s" repeatCount="indefinite" begin="0.2s" />
    </circle>
    <circle cx="0" cy="0" r="2" opacity="0.9">
      <animateMotion path="M 30,270 L 450,530" dur="0.9s" repeatCount="indefinite" begin="0.4s" />
    </circle>
  </g>

  <g fill="#e0f2fe" filter="url(#blurEffect)">
    <polygon points="0,0 -3,10 0,20 3,10" opacity="0.8">
      <animateMotion path="M 450,-50 L 450,550" dur="0.4s" repeatCount="indefinite" begin="0.1s"/>
    </polygon>
    <polygon points="0,0 -4,12 0,24 4,12" fill="#ffffff" opacity="0.9">
      <animateMotion path="M 490,-50 L 490,540" dur="0.35s" repeatCount="indefinite" begin="0s"/>
    </polygon>
    <polygon points="0,0 -2,8 0,16 2,8" opacity="0.7">
      <animateMotion path="M 525,-50 L 525,560" dur="0.5s" repeatCount="indefinite" begin="0.25s"/>
    </polygon>
    <polygon points="0,0 -3,10 0,20 3,10" opacity="0.75">
      <animateMotion path="M 470,-50 L 470,540" dur="0.45s" repeatCount="indefinite" begin="0.15s"/>
    </polygon>
  </g>

  <g transform="translate(480, 530)">
    <ellipse cx="0" cy="0" rx="90" ry="25" fill="url(#impactGlow)">
      <animate attributeName="rx" values="70;100;70" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    
    <ellipse cx="0" cy="-5" rx="120" ry="15" fill="url(#impactGlow)" filter="url(#heavyBlur)" opacity="0.6">
      <animate attributeName="rx" values="100;140;100" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#ffffff" opacity="0.9">
      <circle cx="0" cy="0" r="3">
        <animate attributeName="cx" values="0;-110" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="cy" values="0;-40" dur="0.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="4" fill="#7dd3fc">
        <animate attributeName="cx" values="0;120" dur="0.4s" repeatCount="indefinite" />
        <animate attributeName="cy" values="0;-30" dur="0.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" dur="0.4s" repeatCount="indefinite" />
      </circle>
      <path d="M-10,0 L0,-50 L10,0 Z" fill="#e0f2fe" opacity="0.6" filter="url(#blurEffect)">
        <animate attributeName="transform" values="scale(0.8); scale(1.3); scale(0.8)" dur="0.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

</svg>
