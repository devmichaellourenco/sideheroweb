<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cleaveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e2e8f0" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="cleaveGlow" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g filter="url(#cleaveGlow)">
    <path d="M 60,200 C 180,80 420,60 740,140 L 700,220 C 420,180 220,260 100,240 Z" fill="url(#cleaveGrad)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="0.22s" repeatCount="indefinite"/>
    </path>
    <path d="M 80,230 C 240,150 500,130 760,190" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.7">
      <animate attributeName="stroke-width" values="4;10;4" dur="0.25s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="400" cy="200" rx="120" ry="28" fill="#64748b" opacity="0.2">
      <animate attributeName="rx" values="90;140;90" dur="0.35s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.72;1" dur="0.55s" repeatCount="indefinite"/>
</svg>
