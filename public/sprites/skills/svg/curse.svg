<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="curseCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b0764" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <filter id="curseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <g filter="url(#curseGlow)">
    <circle cx="200" cy="200" r="90" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="18 12">
      <animateTransform attributeName="transform" type="rotate" values="0 200 200;360 200 200" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="60" fill="url(#curseCore)">
      <animate attributeName="r" values="50;70;50" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M 200,120 L 220,200 L 200,280 L 180,200 Z" fill="#c084fc" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.1;0.85;1" dur="0.9s" repeatCount="indefinite"/>
</svg>
