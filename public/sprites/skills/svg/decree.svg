<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="decreeBlade" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
    <filter id="decreeGlow" x="-25%" y="-10%" width="150%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#decreeGlow)">
    <path d="M 200,40 L 250,280 L 200,440 L 150,280 Z" fill="url(#decreeBlade)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="0.28s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="200" cy="420" rx="90" ry="20" fill="#fbbf24" opacity="0.35">
      <animate attributeName="rx" values="70;105;70" dur="0.35s" repeatCount="indefinite"/>
    </ellipse>
    <g stroke="#ffffff" stroke-width="3" opacity="0.7">
      <line x1="200" y1="300" x2="130" y2="250">
        <animate attributeName="opacity" values="1;0" dur="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="200" y1="300" x2="270" y2="250">
        <animate attributeName="opacity" values="1;0" dur="0.3s" begin="0.04s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.75;1" dur="0.52s" repeatCount="indefinite"/>
</svg>
