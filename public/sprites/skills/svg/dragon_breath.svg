      <stop offset="0%" stop-color="#ff0000" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff4500" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
