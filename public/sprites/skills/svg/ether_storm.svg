<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="etherStreak" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#c4b5fd" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="etherBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="etherBlur" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#etherBlur)">
    <rect x="300" y="0" width="200" height="480" fill="url(#etherStreak)" opacity="0.35">
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="0.65s" repeatCount="indefinite"/>
    </rect>
    <line x1="360" y1="-20" x2="360" y2="500" stroke="#ddd6fe" stroke-width="8">
      <animate attributeName="stroke-dashoffset" values="180;-360" dur="0.42s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="-20" x2="440" y2="500" stroke="#a78bfa" stroke-width="6">
      <animate attributeName="stroke-dashoffset" values="120;-300" dur="0.36s" repeatCount="indefinite"/>
    </line>
    <ellipse cx="400" cy="470" rx="120" ry="26" fill="url(#etherBase)">
      <animate attributeName="rx" values="90;135;90" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.88;1" dur="1.1s" repeatCount="indefinite"/>
</svg>
