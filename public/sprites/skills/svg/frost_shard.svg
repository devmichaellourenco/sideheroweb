<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <linearGradient id="shardCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shardEdge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>
    <filter id="iceGlow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#iceGlow)">
    <polygon points="200,40 250,180 200,320 150,180" fill="url(#shardCore)">
      <animateTransform attributeName="transform" type="rotate"
        values="0 200 180; 4 200 180; -3 200 180; 0 200 180" dur="0.35s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="200,70 220,180 200,290 180,180" fill="url(#shardEdge)" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.25s" repeatCount="indefinite"/>
    </polygon>
    <g fill="#ffffff" opacity="0.85">
      <circle cx="200" cy="120" r="3">
        <animate attributeName="cy" values="120;280" dur="0.45s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="185" cy="150" r="2" fill="#bae6fd">
        <animate attributeName="cy" values="150;300" dur="0.55s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="0.55s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="215" cy="130" r="2">
        <animate attributeName="cy" values="130;290" dur="0.5s" begin="0.05s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="0.5s" begin="0.05s" repeatCount="indefinite"/>
      </circle>
    </g>
    <ellipse cx="200" cy="340" rx="36" ry="10" fill="#7dd3fc" opacity="0.35">
      <animate attributeName="rx" values="28;44;28" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="0.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.85;1" dur="0.55s" repeatCount="indefinite"/>
</svg>
