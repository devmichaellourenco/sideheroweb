<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <radialGradient id="slamCore" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </radialGradient>
    <filter id="slamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g filter="url(#slamGlow)">
    <ellipse cx="250" cy="240" rx="180" ry="40" fill="url(#slamCore)">
      <animate attributeName="rx" values="60;200;60" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.2" dur="0.45s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M 120,260 Q 250,180 380,260" fill="none" stroke="#cbd5e1" stroke-width="8" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.4s" repeatCount="indefinite"/>
    </path>
    <g stroke="#e2e8f0" stroke-width="3" opacity="0.7">
      <line x1="250" y1="200" x2="210" y2="150">
        <animate attributeName="opacity" values="1;0" dur="0.35s" repeatCount="indefinite"/>
      </line>
      <line x1="250" y1="200" x2="290" y2="150">
        <animate attributeName="opacity" values="1;0" dur="0.35s" begin="0.05s" repeatCount="indefinite"/>
      </line>
      <line x1="250" y1="200" x2="250" y2="130">
        <animate attributeName="opacity" values="1;0" dur="0.3s" begin="0.02s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.1;0.7;1" dur="0.55s" repeatCount="indefinite"/>
</svg>
