<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <radialGradient id="plasmaFlash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffef77" />
      <stop offset="60%" stop-color="#ff3300" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4a0000" stop-opacity="0" />
    </radialGradient>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(600, 200)" filter="url(#superGlow)">
    
    <circle cx="0" cy="0" r="1" fill="url(#plasmaFlash)">
      <animate attributeName="r"
               values="1; 150; 0"
               dur="0.5s" repeatCount="indefinite"
               keyTimes="0; 0.4; 1"
               begin="0s; flash.end + 0s" id="flash"/>
      <animate attributeName="opacity"
               values="1; 0.8; 0"
               dur="0.5s" repeatCount="indefinite"
               keyTimes="0; 0.6; 1"
               begin="0s; flash.end + 0s"/>
    </circle>
    
    <path d="M 0,0 L -50,5 L -20,0 Z" fill="#ffdd00" opacity="0.9">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -180, -80" dur="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale"
                        values="1 1; 2 1.5; 0.1 0.1" dur="0.6s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0.9; 1; 0" dur="0.6s" repeatCount="indefinite"/>
    </path>

    <path d="M 0,0 L -30,-20 L -10,-10 Z" fill="#ffffff" opacity="0.7">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -250, -180" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale"
                        values="1 1; 1.8 1.2; 0 0" dur="0.9s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0.7; 1; 0" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <path d="M 0,0 L -60,20 L -30,0 Z" fill="#ff4400" opacity="0.8">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -220, 100" dur="0.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale"
                        values="1 1; 2 2; 0.1 0.1" dur="0.7s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0.8; 0" dur="0.7s" repeatCount="indefinite"/>
    </path>

    <circle cx="0" cy="0" r="10" fill="#ffaa00" opacity="0.7">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -140, 60" dur="0.8s" repeatCount="indefinite"/>
       <animateTransform attributeName="transform" type="scale"
                        values="1 1; 0.5 0.5; 0 0" dur="0.8s" repeatCount="indefinite" additive="sum"/>
    </circle>
  </g>
</svg>
