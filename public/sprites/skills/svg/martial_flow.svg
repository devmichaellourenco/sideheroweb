<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="flowSlashA" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="flowGlow" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g filter="url(#flowGlow)">
    <path d="M 80,240 C 200,160 360,150 720,190" fill="none" stroke="url(#flowSlashA)" stroke-width="10" stroke-linecap="round">
      <animate attributeName="stroke-width" values="6;12;6" dur="0.18s" repeatCount="indefinite"/>
    </path>
    <path d="M 120,280 C 260,220 420,210 760,250" fill="none" stroke="#cbd5e1" stroke-width="6" opacity="0.75">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="0.2s" repeatCount="indefinite"/>
