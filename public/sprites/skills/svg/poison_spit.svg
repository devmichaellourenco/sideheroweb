<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <radialGradient id="poisonCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="45%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#365314" stop-opacity="0"/>
    </radialGradient>
    <filter id="poisonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#poisonGlow)">
    <ellipse cx="260" cy="140" rx="70" ry="40" fill="url(#poisonCore)">
      <animate attributeName="rx" values="55;80;55" dur="0.25s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M 240,120 Q 280,100 320,130 Q 280,160 240,150 Z" fill="#a3e635" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 280 135;8 280 135;-6 280 135;0 280 135" dur="0.3s" repeatCount="indefinite"/>
    </path>
    <g fill="#ecfccb" opacity="0.8">
      <circle cx="290" cy="125" r="3">
        <animate attributeName="cx" values="290;340" dur="0.35s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.35s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.78;1" dur="0.42s" repeatCount="indefinite"/>
</svg>
