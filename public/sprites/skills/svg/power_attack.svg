<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="heavySlash" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff4500" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#ffd700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="heavyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#heavyGlow)">
    <path d="M 120,220 C 220,120 420,100 680,180 L 640,240 C 420,200 260,250 160,280 Z" fill="url(#heavySlash)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="0.18s" repeatCount="indefinite"/>
    </path>
    <path d="M 140,250 C 280,180 480,160 700,210 L 660,270 C 460,240 300,290 180,310 Z" fill="#ffffff" opacity="0.75">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 6,-2; 0,0" dur="0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 100,240 L 720,200" stroke="#ff8c00" stroke-width="14" stroke-linecap="round" opacity="0.5">
      <animate attributeName="stroke-width" values="10;18;10" dur="0.22s" repeatCount="indefinite"/>
    </path>
    <g fill="#ffd700" opacity="0.9">
      <circle cx="620" cy="190" r="5">
        <animate attributeName="cx" values="620;680" dur="0.25s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.25s" repeatCount="indefinite"/>
      </circle>
      <circle cx="580" cy="210" r="4">
        <animate attributeName="cx" values="580;650" dur="0.3s" begin="0.05s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="0.3s" begin="0.05s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.75;1" dur="0.48s" repeatCount="indefinite"/>
</svg>
