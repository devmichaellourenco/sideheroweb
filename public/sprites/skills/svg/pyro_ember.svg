<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <radialGradient id="emberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffdf00"/>
      <stop offset="70%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emberTail" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <filter id="emberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g filter="url(#emberGlow)">
    <ellipse cx="280" cy="140" rx="90" ry="36" fill="url(#emberTail)">
      <animate attributeName="rx" values="75;100;75" dur="0.2s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="300" cy="140" r="28" fill="url(#emberCore)">
      <animate attributeName="r" values="24;32;24" dur="0.18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="308" cy="132" r="10" fill="#ffffff" opacity="0.85"/>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.82;1" dur="0.45s" repeatCount="indefinite"/>
</svg>
