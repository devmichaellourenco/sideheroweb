<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="infernoStreak" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ff6a00" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="infernoBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="1"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="infernoBlur" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#infernoBlur)">
    <rect x="320" y="0" width="160" height="520" fill="url(#infernoStreak)" opacity="0.35">
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <line x1="360" y1="-40" x2="360" y2="540" stroke="url(#infernoStreak)" stroke-width="10">
      <animate attributeName="stroke-dashoffset" values="200;-400" dur="0.45s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="-40" x2="440" y2="540" stroke="url(#infernoStreak)" stroke-width="8">
      <animate attributeName="stroke-dashoffset" values="150;-350" dur="0.38s" repeatCount="indefinite"/>
    </line>
    <g fill="#ffd700" opacity="0.85">
      <circle cx="0" cy="0" r="4">
        <animateMotion path="M 400,-20 L 400,520" dur="0.55s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#ff4500">
        <animateMotion path="M 430,-10 L 430,530" dur="0.48s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <ellipse cx="400" cy="520" rx="110" ry="28" fill="url(#infernoBase)">
      <animate attributeName="rx" values="85;125;85" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.88;1" dur="1.2s" repeatCount="indefinite"/>
</svg>
