<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <radialGradient id="radianceCore" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#bbf7d0" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
    <filter id="radianceGlow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <g filter="url(#radianceGlow)">
    <ellipse cx="200" cy="250" rx="110" ry="130" fill="url(#radianceCore)">
      <animate attributeName="ry" values="115;140;115" dur="0.85s" repeatCount="indefinite"/>
    </ellipse>
    <g fill="#ffffff" opacity="0.9">
      <circle cx="200" cy="120" r="4">
        <animate attributeName="cy" values="120;340" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.75s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="160" r="3" fill="#86efac">
        <animate attributeName="cy" values="160;360" dur="0.85s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="0.85s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <ellipse cx="200" cy="390" rx="80" ry="18" fill="#4ade80" opacity="0.3">
      <animate attributeName="rx" values="60;95;60" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.1;0.88;1" dur="0.95s" repeatCount="indefinite"/>
</svg>
