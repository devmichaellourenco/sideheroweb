<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="100%" height="100%">
  <defs>
    <radialGradient id="sanctuaryDome" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#fde68a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sanctuaryGlow" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g filter="url(#sanctuaryGlow)">
    <path d="M 60,420 Q 240,80 420,420 Z" fill="url(#sanctuaryDome)" stroke="#fde68a" stroke-width="2" opacity="0.85">
      <animate attributeName="opacity" values="0.6;0.95;0.6" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <g stroke="#ffffff" stroke-width="2" opacity="0.6">
      <line x1="240" y1="120" x2="240" y2="400">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="140" y1="280" x2="340" y2="280">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1s" begin="0.1s" repeatCount="indefinite"/>
      </line>
    </g>
    <ellipse cx="240" cy="430" rx="140" ry="22" fill="#fbbf24" opacity="0.2">
      <animate attributeName="rx" values="110;160;110" dur="1s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.12;0.9;1" dur="1.05s" repeatCount="indefinite"/>
</svg>
