<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="holyBolt" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="smiteImpact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="smiteGlow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#smiteGlow)">
    <polygon points="200,20 230,180 200,220 170,180" fill="url(#holyBolt)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="0.15s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="200,40 215,170 200,200 185,170" fill="#ffffff" opacity="0.85"/>
    <path d="M 160,200 L 200,80 L 240,200 L 200,260 Z" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="0.2s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="200" cy="320" rx="75" ry="22" fill="url(#smiteImpact)">
      <animate attributeName="rx" values="60;90;60" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="0.45s" repeatCount="indefinite"/>
    </ellipse>
    <g stroke="#ffffff" stroke-width="2" opacity="0.8">
      <line x1="200" y1="300" x2="140" y2="260">
        <animate attributeName="opacity" values="1;0" dur="0.35s" repeatCount="indefinite"/>
      </line>
      <line x1="200" y1="300" x2="260" y2="260">
        <animate attributeName="opacity" values="1;0" dur="0.35s" begin="0.05s" repeatCount="indefinite"/>
      </line>
      <line x1="200" y1="300" x2="200" y2="240">
        <animate attributeName="opacity" values="1;0" dur="0.3s" begin="0.02s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.78;1" dur="0.5s" repeatCount="indefinite"/>
</svg>
