<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="boltCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#aaccff" />
    </linearGradient>

    <filter id="lightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="afterglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.8  0 0 0 0 1  0 0 0 1 0" />
    </filter>
  </defs>

  <g filter="url(#lightGlow)">
    <polyline points="200,0 180,100 220,200 190,300 210,400 185,500 200,600 170,700 200,780"
              stroke="#00ccff" stroke-width="15" fill="none" opacity="0" stroke-linecap="round">
      <animate attributeName="opacity"
               values="0; 1; 0.5; 0"
               dur="0.6s" begin="0.1s; bolt1.end + 1s"
               fill="freeze" />
       <animate attributeName="stroke-width"
               values="15; 30; 5; 2"
               dur="0.6s" begin="0.1s; bolt1.end + 1s"
               fill="freeze" />
    </polyline>

    <polyline id="bolt1" points="200,0 180,100 220,200 190,300 210,400 185,500 200,600 170,700 200,780"
              stroke="url(#boltCore)" stroke-width="4" fill="none"
              stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset"
               values="1000; 0" dur="0.08s"
               begin="0s; bolt2.end + 0.8s" fill="freeze" id="fast_bolt1"/>
      <animate attributeName="opacity"
               values="1; 1; 0" dur="0.3s"
               begin="fast_bolt1.end + 0.05s" fill="freeze" />
    </polyline>

    <circle cx="200" cy="780" r="1" fill="#ffffff" opacity="0">
      <animate attributeName="r" values="1; 80; 1" dur="0.25s" begin="fast_bolt1.end" fill="freeze" />
      <animate attributeName="opacity" values="0; 1; 0" dur="0.25s" begin="fast_bolt1.end" fill="freeze" />
    </circle>
  </g>

  <g filter="url(#lightGlow)" transform="translate(-100, 50) scale(0.8)">
     <polyline id="bolt2" points="150,0 130,80 160,160 140,240 165,320 135,400 150,480 120,560 150,700"
              stroke="#bbddff" stroke-width="3" fill="none"
              stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset"
               values="1000; 0" dur="0.06s"
               begin="bolt1.end + 0.3s" fill="freeze" id="fast_bolt2"/>
      <animate attributeName="opacity"
               values="1; 0.9; 0" dur="0.2s"
               begin="fast_bolt2.end + 0.05s" fill="freeze" />
    </polyline>
    
    <circle cx="150" cy="700" r="1" fill="#aaccff" opacity="0">
      <animate attributeName="r" values="1; 40; 1" dur="0.15s" begin="fast_bolt2.end" fill="freeze" />
      <animate attributeName="opacity" values="0; 0.8; 0" dur="0.15s" begin="fast_bolt2.end" fill="freeze" />
    </circle>
  </g>
  
  <rect x="0" y="0" width="400" height="800" fill="#ccffff" opacity="0" filter="url(#afterglow)">
      <animate attributeName="opacity"
               values="0; 0.15; 0.05; 0"
               dur="0.8s" begin="0.1s; bolt1.end + 1s"
               fill="freeze" />
  </rect>

</svg>
