<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="drainBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#7e22ce" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="drainOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <filter id="drainGlow" x="-30%" y="-15%" width="160%" height="130%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#drainGlow)">
    <rect x="170" y="40" width="60" height="360" rx="20" fill="url(#drainBeam)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="200" cy="400" r="45" fill="url(#drainOrb)">
      <animate attributeName="r" values="35;55;35" dur="0.45s" repeatCount="indefinite"/>
    </circle>
    <g fill="#ddd6fe" opacity="0.85">
      <circle cx="200" cy="80" r="3">
        <animate attributeName="cy" values="80;380" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="185" cy="120" r="2">
        <animate attributeName="cy" values="120;390" dur="0.55s" begin="0.08s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="0.55s" begin="0.08s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <animate attributeName="opacity" values="0;1;1;0" times="0;0.08;0.82;1" dur="0.58s" repeatCount="indefinite"/>
</svg>
